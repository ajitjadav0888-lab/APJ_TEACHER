name: APJ Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project ZIP
        run: |
          unzip -o APJ_V1_0_Android_Project_RC.zip -d apj_project

      - name: Build APK with installed Gradle
        run: |
          cd apj_project/apj_build/android

          echo "Android project:"
          ls -la

          gradle --version
          gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APJ-release-APK
          path: |
            apj_project/apj_build/android/app/build/outputs/apk/release/*.apk
